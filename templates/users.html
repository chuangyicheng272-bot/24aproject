{% extends 'base.html' %}
{% block title %}帳戶管理｜SafeGuard{% endblock %}
{% block head_extra %}<link rel="stylesheet" href="{{ url_for('static', filename='users.css', v='20260809-1') }}">{% endblock %}
{% block content %}
<main class="page account-management-page">
  <div class="crumb">首頁　/　系統總覽　/　帳戶管理</div>
  <a class="back" href="{{ url_for('dashboard') }}">返回系統總覽</a>
  <nav class="account-section-nav" aria-label="帳戶管理功能">
    <a class="account-section-link active" href="{{ url_for('users') }}" aria-current="page">
      <span class="account-section-icon">♙</span><strong>所有帳戶</strong>
    </a>
    <a class="account-section-link" href="{{ url_for('email_service') }}">
      <span class="account-section-icon">✉</span><strong>Email 郵寄服務</strong>
    </a>
  </nav>
  <section class="panel user-panel">
    <div class="user-tools">
      <div>
        <h1>所有帳戶管理</h1>
        <p class="user-help">新增、編輯、停用或刪除系統帳戶；管理員可在「編輯」中輸入新密碼進行人工重設。</p>
      </div>
      <button class="primary" onclick="openUserForm()">＋ 新增帳戶</button>
    </div>
    <div class="search">
      <input id="userSearch" placeholder="帳號、姓名、電話或電子郵件">
      <button onclick="loadUsers()">搜尋</button>
      <button onclick="exportUsers()">⇩ 匯出 CSV</button>
    </div>
    <div class="table-scroll">
      <table class="user-table">
        <thead>
          <tr>
            <th>帳號</th><th>姓名</th><th>電話</th><th>電子郵件</th><th>角色</th>
            <th>狀態</th><th>建立日期</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="userRows"></tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="userDialog">
  <form method="dialog" id="userForm" class="user-account-form">
    <h2 id="dialogTitle">新增帳戶</h2>
    <input type="hidden" id="editUserId">
    <label>帳號<input id="account" required></label>
    <label>姓名<input id="name" required></label>
    <label>電話<input id="phone" required placeholder="例如 0912345678"></label>
    <label>角色
      <select id="role">
        <option value="一般使用者">一般使用者</option>
        <option value="管理員">管理員</option>
      </select>
    </label>
    <label class="full-field">電子郵件
      <input id="email" type="email" required placeholder="例如 c113118118@nkust.edu.tw" title="請輸入有效的電子郵件地址">
      <small>用於寄送忘記密碼重設連結與帳戶安全通知。</small>
    </label>
    <label class="full-field">密碼 <small>（編輯時輸入新密碼即可人工重設；留白則不變更）</small><input id="password" type="password" minlength="6" autocomplete="new-password"></label>
    <div class="dialog-actions">
      <button value="cancel">取消</button>
      <button class="primary" value="default" onclick="saveUser(event)">儲存</button>
    </div>
  </form>
</dialog>
<script>loadUsers()</script>
{% endblock %}
