<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YOLO 服務未連線</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f5;color:#17211c;font-family:Arial,"Microsoft JhengHei",sans-serif;padding:24px}.card{width:min(620px,100%);border:1px solid #dce4df;border-radius:14px;background:#fff;padding:38px;box-shadow:0 12px 32px #17211c12}.icon{width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:#fff0cf;color:#a76000;font-size:27px}h1{margin:20px 0 10px;font-size:27px}p{color:#64736d;line-height:1.7}.code{padding:13px 15px;border-radius:8px;background:#f1f4f2;color:#2d4a5d;font-family:Consolas,monospace;overflow-wrap:anywhere}.detail{font-size:12px;color:#8b9691}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">▶</div>
    <h1>YOLO 辨識服務尚未啟動</h1>
    <p>SafeGuard 主系統正常，但尚未連上獨立的 YOLO 後端。請啟動 <strong>systems/yolo</strong> 內的後端服務後重新整理。</p>
    <div class="code">{{ backend_url }}</div>
    {% if detail %}<p class="detail">{{ detail }}</p>{% endif %}
  </main>
</body>
</html>
