<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}SafeGuard{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='extra.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
{% if request.endpoint not in ['login', 'reset_password_page'] %}
  <header class="topbar">
    <a href="{{ url_for('dashboard') }}" class="brand">◈ SafeGuard</a>
    <div class="topbar-actions">
      <label class="system-language-control">
        <span>語言</span>
        <select data-language-select data-i18n-skip aria-label="語言">
          <option value="zh-Hant">繁體中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <span class="user-name">{{ session.user_role if request.endpoint in ['yolo', 'site_map'] else session.user_name }}</span>
      <a href="{{ url_for('logout') }}" class="logout">登出</a>
    </div>
  </header>
{% else %}
  <label class="system-language-control system-language-standalone">
    <span>語言</span>
    <select data-language-select data-i18n-skip aria-label="語言">
      <option value="zh-Hant">繁體中文</option>
      <option value="en">English</option>
    </select>
  </label>
{% endif %}
<script src="{{ url_for('static', filename='i18n.js', v='20260816-3') }}"></script>
<script src="{{ url_for('static', filename='app.js', v='20260809-1') }}"></script>
{% block content %}{% endblock %}
<div id="toast" class="toast"></div>
</body>
</html>
